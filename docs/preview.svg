<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <clipPath id="peakr-ribbon">
      <rect x="62" y="148" width="230" height="10" rx="5"/>
    </clipPath>
  </defs>

  <rect width="640" height="300" rx="20" fill="#f3f5f9"/>

  <!-- Countdown card -->
  <rect x="48" y="56" width="272" height="188" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="1.5"/>

  <!-- Status dot with pulse rings -->
  <circle cx="70" cy="82" r="13" fill="none" stroke="#d0574c" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="70" cy="82" r="8.5" fill="none" stroke="#d0574c" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="70" cy="82" r="5" fill="#d0574c"/>

  <!-- Title -->
  <rect x="88" y="76" width="92" height="11" rx="5.5" fill="#c7d1de"/>

  <!-- Caption and countdown -->
  <rect x="62" y="104" width="58" height="6" rx="3" fill="#dfe5ee"/>
  <rect x="62" y="116" width="112" height="15" rx="6" fill="#33465c"/>

  <!-- 24-hour ribbon -->
  <g clip-path="url(#peakr-ribbon)">
    <rect x="62" y="148" width="38" height="10" fill="#9ed3b3"/>
    <rect x="100" y="148" width="153" height="10" fill="#eda39c"/>
    <rect x="253" y="148" width="39" height="10" fill="#9ed3b3"/>
  </g>
  <rect x="153" y="145" width="2.5" height="16" rx="1.25" fill="#33465c" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Axis ticks -->
  <rect x="62" y="166" width="14" height="5" rx="2.5" fill="#d5dce7"/>
  <rect x="169" y="166" width="16" height="5" rx="2.5" fill="#d5dce7"/>
  <rect x="276" y="166" width="16" height="5" rx="2.5" fill="#d5dce7"/>

  <!-- Schedule footer -->
  <rect x="62" y="182" width="230" height="1" fill="#e8edf3"/>
  <rect x="62" y="192" width="118" height="5" rx="2.5" fill="#dfe5ee"/>
  <rect x="190" y="192" width="48" height="5" rx="2.5" fill="#e8edf3"/>

  <!-- Three states -->
  <circle cx="426" cy="100" r="17" fill="none" stroke="#d0574c" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="426" cy="100" r="11" fill="none" stroke="#d0574c" stroke-opacity="0.30" stroke-width="2"/>
  <circle cx="426" cy="100" r="5.5" fill="#d0574c"/>
  <rect x="456" y="97" width="72" height="6" rx="3" fill="#d5dce7"/>

  <circle cx="426" cy="160" r="12" fill="none" stroke="#dda33f" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="426" cy="160" r="5.5" fill="#dda33f"/>
  <rect x="456" y="157" width="60" height="6" rx="3" fill="#d5dce7"/>

  <circle cx="426" cy="220" r="5.5" fill="#4aa87a"/>
  <rect x="456" y="217" width="84" height="6" rx="3" fill="#d5dce7"/>
</svg>
